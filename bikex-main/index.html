<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="img/Bike X in black version.png">
<script>
  (function(){
    var lang = localStorage.getItem("moto_lang") || "en";
    document.documentElement.setAttribute("lang", lang);
    document.documentElement.setAttribute("dir", lang === "ar" ? "rtl" : "ltr");
    var savedTheme = localStorage.getItem("moto_theme");
    var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.setAttribute("data-theme", savedTheme || (prefersDark ? "dark" : "light"));
  })();
</script>
<title>Bike.X — Buy &amp; sell motorcycles in Saudi Arabia</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body data-title-key="titleHome">
<div id="pageLoader">
  <div class="loader-mark">BIKE<span class="dot">.X</span></div>
</div>


<header class="site-header">
  <div class="header-row">
    <a href="index.html" class="logo">
      <span class="site-logo-badge"><img src="img/logo.png" alt="Bike.X" class="site-logo-img"></span>
      <span class="tagline" data-i18n="tagline">motorcycles only</span>
    </a>
    
    <!-- Desktop Search -->
    <form class="search-form" id="searchForm">
      <input type="text" id="searchInput" data-i18n-placeholder="searchPlaceholder" placeholder="Search brand, model or city…" aria-label="Search listings">
      <button type="submit" data-i18n="searchBtn">Search</button>
    </form>
    
    <div class="header-actions">
      <a href="sell.html" class="btn btn-solid" data-i18n="sellBtn">+ Sell</a>
      <div class="auth-area" id="authArea"></div>
      <button class="btn lang-switch" id="langSwitch">العربية</button>
      <button class="theme-switch" id="themeSwitch" data-i18n-aria="themeAria" aria-label="Toggle dark mode">
        <span class="knob">
          <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="5"/></svg>
        </span>
      </button>
      
      <!-- Hamburger Menu -->
      <a href="sell.html" class="btn btn-solid mobile-quick-sell" data-i18n="sellBtn">+ Sell</a>
      <button class="hamburger-menu" id="hamburgerMenu" aria-label="Toggle menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </div>
</header>

<!-- Mobile Menu -->
<div class="menu-backdrop" id="menuBackdrop"></div>
<div class="mobile-menu-overlay" id="mobileMenuOverlay">
  <div class="mobile-menu-content">
    <div class="mobile-menu-header">
      <span class="mobile-menu-logo site-logo-badge"><img src="img/logo.png" alt="Bike.X" class="site-logo-img"></span>
      <button class="mobile-menu-close" id="mobileMenuClose">×</button>
    </div>
    
    <!-- Mobile Search -->
    <div class="mobile-search">
      <div class="mobile-search-wrapper">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/>
          <path d="M21 21l-4.35-4.35"/>
        </svg>
        <input type="text" id="mobileSearchInput" data-i18n-placeholder="searchPlaceholder" placeholder="Search brand, model or city…" aria-label="Search listings">
        <button type="submit" id="mobileSearchBtn" data-i18n="searchBtn">Search</button>
      </div>
    </div>
    
    <!-- Mobile Navigation -->
    <nav class="mobile-nav">
      <a href="index.html" class="mobile-nav-link active" data-i18n="home">Home</a>
      <a href="about.html" class="mobile-nav-link" data-i18n="about">About</a>
      <a href="contact.html" class="mobile-nav-link" data-i18n="contact">Contact</a>
      <div class="mobile-divider"></div>
      <a href="sell.html" class="mobile-nav-link btn-solid" data-i18n="sellBtn">+ Sell</a>
      <div class="mobile-divider"></div>
      <div id="mobileNavAuth" class="mobile-nav-auth"></div>
    </nav>
    
    <!-- Mobile Auth greeting -->
    <div class="mobile-auth-section" id="mobileAuth"></div>
    
    <!-- Mobile Settings -->
    <div class="mobile-menu-footer">
      <button class="btn lang-switch" id="mobileLangSwitch">العربية</button>
      <button class="theme-switch" id="mobileThemeSwitch" data-i18n-aria="themeAria" aria-label="Toggle dark mode">
        <span class="knob">
          <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="5"/></svg>
        </span>
      </button>
    </div>
  </div>
</div>

<!-- Hero Slider -->
<section class="hero">
  <div class="hero-road"></div>
  <div class="hero-inner">
    <div class="hero-slider" id="heroOffers" aria-label="Recent motorcycle offers" aria-live="polite">
      <div class="hero-slide-track" id="heroSlideTrack">
        <!-- slides injected by JavaScript -->
      </div>
      <div class="hero-slider-dots" id="heroOfferDots"></div>
    </div>
  </div>
</section>

<!-- Category Switcher -->
<section class="category-switcher">
  <div class="category-tabs" id="categoryTabs">
    <button type="button" class="category-tab" data-category="services">
      <i class="fa-solid fa-align-right fa-lg" style="color: rgb(255, 122, 61);"></i>
      <span class="cat-label" data-i18n="catServices">Services</span>
    </button>
    <button type="button" class="category-tab" data-category="gear">
      <i class="fa-solid fa-helmet-un fa-lg" style="color: rgb(255, 122, 61);"></i>
      <span class="cat-label" data-i18n="catGear">Gear &amp; Accessories</span>
    </button>
    <button type="button" class="category-tab" data-category="parts">
      <i class="fa-solid fa-gear fa-lg" style="color: rgb(255, 122, 61);"></i>
      <span class="cat-label" data-i18n="catParts">Parts</span>
    </button>
    <button type="button" class="category-tab active" data-category="motorcycles">
      <i class="fa-solid fa-motorcycle fa-lg" style="color: rgb(255, 122, 61);"></i>
      <span class="cat-label" data-i18n="catMotorcycles">Motorcycles</span>
    </button>
  </div>
</section>

<main class="main-grid">
  <aside class="filters">
    <h3 data-i18n="filtersTitle">Filters</h3>
    <div class="filter-group" id="brandFilterGroup">
      <label data-i18n="labelBrand">Brand</label>
      <div class="brand-grid" id="brandGrid"></div>
      <button type="button" class="brand-more-btn" id="brandShowMore">
        <span data-i18n="showMore">Show more</span>
        <svg class="chev" viewBox="0 0 448 512" aria-hidden="true"><path fill="currentColor" d="M207.029 381.476L12.686 187.132c-9.373-9.373-9.373-24.569 0-33.941l22.667-22.667c9.357-9.357 24.522-9.375 33.901-.04L224 284.505l154.745-154.021c9.379-9.335 24.544-9.317 33.901.04l22.667 22.667c9.373 9.373 9.373 24.569 0 33.941L240.971 381.476c-9.373 9.372-24.569 9.372-33.942 0z"></path></svg>
      </button>
    </div>
    <!-- NEW: Region + City filters -->
    <div class="filter-group" id="regionFilterGroup">
      <label for="filterRegion" data-i18n="labelRegion">Region</label>
      <select id="filterRegion">
        <option value="" data-i18n="allRegions">All regions</option>
      </select>
    </div>
    <div class="filter-group" id="cityFilterGroup">
      <label for="filterCity" data-i18n="labelCity">City</label>
      <select id="filterCity">
        <option value="" data-i18n="allCities">All cities</option>
      </select>
    </div>
    <div class="filter-group" id="conditionFilterGroup">
      <label for="filterCondition" data-i18n="labelCondition">Condition</label>
      <select id="filterCondition">
        <option value="" data-i18n="conditionAny">New or used</option>
        <option value="new" data-i18n="conditionNew">New</option>
        <option value="used" data-i18n="conditionUsed">Used</option>
      </select>
    </div>
    <div class="filter-group">
      <label data-i18n="priceRangeLabel">Price range (SAR)</label>
      <div class="range-row">
        <input type="number" id="minPrice" data-i18n-placeholder="minPlaceholder" placeholder="Min" min="0">
        <input type="number" id="maxPrice" data-i18n-placeholder="maxPlaceholder" placeholder="Max" min="0">
      </div>
    </div>
    <button class="btn" id="favToggle" data-i18n="savedOnly">♥ Saved only</button>
    <button class="btn" id="clearFilters" data-i18n="clearFilters" style="margin-top:10px;">Clear all filters</button>
  </aside>

  <section>
    <div class="results-bar">
      <div class="results-count" id="resultsCount"></div>
      <div class="sort-row">
        <select id="sortSelect" aria-label="Sort listings">
          <option value="newest" data-i18n="sortNewest">Newest</option>
          <option value="price-asc" data-i18n="sortPriceAsc">Price: low to high</option>
          <option value="price-desc" data-i18n="sortPriceDesc">Price: high to low</option>
          <option value="mileage-asc" data-i18n="sortMileageAsc">Mileage: lowest first</option>
          <option value="year-desc" data-i18n="sortYearDesc">Year: newest first</option>
        </select>
      </div>
    </div>
    <div class="grid" id="grid"></div>
  </section>
</main>

<footer class="site-footer">
  <div class="footer-content">
    <div class="footer-links">
      <a href="index.html" data-i18n="home">Home</a>
      <a href="about.html" data-i18n="about">About</a>
      <a href="contact.html" data-i18n="contact">Contact</a>
    </div>
    <p data-i18n="footerText">Bike.X — a motorcycle-only classifieds.</p>
  </div>
</footer>

<script src="js/i18n.js"></script>
<script src="js/services/dataService.js"></script>
<script src="js/auth.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  function initTheme(){
    const saved = localStorage.getItem("moto_theme");
    const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute("data-theme", saved || (prefersDark ? "dark" : "light"));
    if (typeof applyThemeLogo === "function") applyThemeLogo();
  }
  function toggleTheme(){
    const current = document.documentElement.getAttribute("data-theme");
    const next = current === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    localStorage.setItem("moto_theme", next);
    if (typeof applyThemeLogo === "function") applyThemeLogo();
  }
  initTheme();
  document.getElementById("themeSwitch").addEventListener("click", toggleTheme);

  document.addEventListener("DOMContentLoaded", function() {
    renderAuthArea();
    setupMobileMenu();
  });

  document.addEventListener("DOMContentLoaded", function() {
    console.log('Checking data...');
    console.log('SEED_LISTINGS:', typeof SEED_LISTINGS !== 'undefined' ? SEED_LISTINGS.length : 'undefined');
    console.log('BRANDS:', typeof BRANDS !== 'undefined' ? BRANDS : 'undefined');
    console.log('CITIES:', typeof CITIES !== 'undefined' ? CITIES : 'undefined');
    
    setTimeout(function() {
      if (typeof renderGrid !== 'undefined') {
        console.log('Calling renderGrid manually');
        renderGrid();
        renderHeroOffers();
      }
    }, 500);
  });
</script>
</body>
</html>
